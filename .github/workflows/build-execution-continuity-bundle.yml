name: Build Execution Continuity Bundle

on:
  push:
    branches:
      - main
    paths:
      - "execution-continuity-control/**"
      - ".github/workflows/build-execution-continuity-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine canonical identifiers
        id: ids
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA="${GITHUB_SHA}"
          SKILL_TREE_SHA="$(git rev-parse "${COMMIT_SHA}:execution-continuity-control")"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "skill_tree_sha=${SKILL_TREE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Stage canonical single-file bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp execution-continuity-control/bundle.py dist/bundle.py
          chmod +x dist/bundle.py

      - name: Validate generated bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/bundle.py
          python3 -m py_compile dist/bundle.py
          printf '%s\n' '{"schema":"execution-continuity-initialization-v1","type":"INITIALIZE","user_prompt":"Smoke-test user prompt."}' | python3 dist/bundle.py > dist/initial-payload.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('dist/initial-payload.json').read_text())
          assert payload['schema'] == 'execution-continuity-payload-v4'
          assert payload['authority'] == 'TASK_ACTION'
          assert payload['task_prompt'] == 'Smoke-test user prompt.'
          assert isinstance(payload['state'], dict)
          assert payload['state']['control_version'] == 4
          assert payload['state']['original_user_prompt'] == 'Smoke-test user prompt.'
          assert payload['state']['task_prompt'] == 'Smoke-test user prompt.'
          assert payload['state']['prompt_intake_mode'] == 'VERBATIM'
          assert payload['command']
          assert payload['payload_sha256']
          PY
          sha256sum dist/bundle.py > dist/bundle.py.sha256

      - name: Upload canonical bundle artifact
        id: upload_bundle
        uses: actions/upload-artifact@v4
        with:
          name: execution-continuity-control-${{ steps.ids.outputs.skill_tree_sha }}
          path: dist/bundle.py
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Write current bundle pointer
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_bundle.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_bundle.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_bundle.outputs.artifact-digest }}
          COMMIT_SHA: ${{ steps.ids.outputs.commit_sha }}
          SKILL_TREE_SHA: ${{ steps.ids.outputs.skill_tree_sha }}
        run: |
          set -euo pipefail
          BUNDLE_SHA256="$(cut -d ' ' -f1 dist/bundle.py.sha256)"
          cat > execution-continuity-bundle.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "artifact_id": "${ARTIFACT_ID}",
            "artifact_url": "${ARTIFACT_URL}",
            "artifact_digest": "${ARTIFACT_DIGEST}",
            "bundle_filename": "bundle.py",
            "bundle_sha256": "${BUNDLE_SHA256}",
            "commit_sha": "${COMMIT_SHA}",
            "skill_tree_sha": "${SKILL_TREE_SHA}"
          }
          EOF

      - name: Publish bundle pointer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add execution-continuity-bundle.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update execution continuity bundle pointer [skip ci]"
          git push
