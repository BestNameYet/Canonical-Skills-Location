name: Build Execution Continuity Bundle

on:
  push:
    branches:
      - main
    paths:
      - "execution-continuity-control/**"
      - "staging/preprocessor_refactor_git.patch.gz.b64"
      - ".github/workflows/build-execution-continuity-bundle.yml"

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Materialize and validate preprocessor v2
        id: source
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse "${GITHUB_SHA}^")"
          base64 -d staging/preprocessor_refactor_git.patch.gz.b64 | gzip -d > /tmp/preprocessor-v2.patch
          git apply --check /tmp/preprocessor-v2.patch
          git apply /tmp/preprocessor-v2.patch
          test "$(sha256sum execution-continuity-control/bundle.py | cut -d ' ' -f1)" = "1e86cbe178451c25c092700595215a7a86a36455a3188cbf9f694108e8da4b2a"
          test "$(sha256sum execution-continuity-control/SKILL.md | cut -d ' ' -f1)" = "bf8be11e8866fd8451760738c61e5a0f83a000e4fc795c6e35821e700802de29"
          test "$(sha256sum execution-continuity-control/DESIGN_HISTORY.md | cut -d ' ' -f1)" = "9884fb8ea89814561fa5d4a8a86b96e299b2770d569805854ea4877f16baf1e7"
          python3 -m py_compile execution-continuity-control/bundle.py
          printf '%s\n' '{"schema":"execution-continuity-initialization-v1","type":"INITIALIZE","user_prompt":"Smoke-test user prompt."}' | python3 execution-continuity-control/bundle.py > /tmp/initial-payload.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/initial-payload.json'))
          assert p['schema']=='execution-continuity-payload-v4'
          assert p['authority']=='TASK_ACTION'
          assert p['task_prompt']=='Smoke-test user prompt.'
          assert p['state']['prompt_intake_mode']=='VERBATIM'
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show "${BASE_SHA}:.github/workflows/build-execution-continuity-bundle.yml" > .github/workflows/build-execution-continuity-bundle.yml
          git rm staging/preprocessor_refactor_git.patch.gz.b64
          git add execution-continuity-control/bundle.py execution-continuity-control/SKILL.md execution-continuity-control/DESIGN_HISTORY.md .github/workflows/build-execution-continuity-bundle.yml
          TREE_SHA="$(git write-tree)"
          SOURCE_COMMIT="$(printf '%s\n' 'Install source-anchored semantic preprocessor v2' | git commit-tree "$TREE_SHA" -p "$BASE_SHA")"
          git push --force-with-lease=refs/heads/main:${GITHUB_SHA} origin "${SOURCE_COMMIT}:refs/heads/main"
          git reset --hard "$SOURCE_COMMIT"
          SKILL_TREE_SHA="$(git rev-parse "${SOURCE_COMMIT}:execution-continuity-control")"
          echo "commit_sha=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "skill_tree_sha=${SKILL_TREE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Stage canonical single-file bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp execution-continuity-control/bundle.py dist/bundle.py
          chmod +x dist/bundle.py
          sha256sum dist/bundle.py > dist/bundle.py.sha256

      - name: Upload canonical bundle artifact
        id: upload_bundle
        uses: actions/upload-artifact@v4
        with:
          name: execution-continuity-control-${{ steps.source.outputs.skill_tree_sha }}
          path: dist/bundle.py
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Write and publish current bundle pointer
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_bundle.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_bundle.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload_bundle.outputs.artifact-digest }}
          COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
          SKILL_TREE_SHA: ${{ steps.source.outputs.skill_tree_sha }}
        run: |
          set -euo pipefail
          BUNDLE_SHA256="$(cut -d ' ' -f1 dist/bundle.py.sha256)"
          cat > execution-continuity-bundle.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "main",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "artifact_id": "${ARTIFACT_ID}",
            "artifact_url": "${ARTIFACT_URL}",
            "artifact_digest": "${ARTIFACT_DIGEST}",
            "bundle_filename": "bundle.py",
            "bundle_sha256": "${BUNDLE_SHA256}",
            "commit_sha": "${COMMIT_SHA}",
            "skill_tree_sha": "${SKILL_TREE_SHA}"
          }
          EOF
          git add execution-continuity-bundle.json
          git commit -m "Update execution continuity bundle pointer [skip ci]"
          git push origin HEAD:main
