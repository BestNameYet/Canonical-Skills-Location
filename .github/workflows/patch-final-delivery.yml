name: Patch final delivery routing

on:
  push:
    branches:
      - final-delivery-routing-20260819T1036Z

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical patch
        shell: bash
        run: |
          cat > /tmp/patch.b64 <<'EOF'
 
EOF
          base64 -d /tmp/patch.b64 > /tmp/patch.py
          python /tmp/patch.py
          python -m py_compile execution-continuity-control/scripts/runtime_bundle.py
          git diff --check
          rm .github/workflows/patch-final-delivery.yml
          git config user.name "execution-continuity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add execution-continuity-control/SKILL.md execution-continuity-control/DESIGN_HISTORY.md execution-continuity-control/scripts/runtime_bundle.py .github/workflows/patch-final-delivery.yml
          git commit -m "Add post-Orchestrator final delivery routing"
          git push origin HEAD:final-delivery-routing-20260819T1036Z
